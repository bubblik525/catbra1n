name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac-arm64
            args: --mac --arm64
          - os: macos-15-intel
            platform: mac-intel
            args: --mac --x64
          - os: windows-latest
            platform: windows-x64
            args: --win nsis --x64
          - os: ubuntu-latest
            platform: linux-x64
            args: --linux AppImage --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - name: Native window smoke test
        if: runner.os != 'Linux'
        run: npm run smoke
      - name: Linux window smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Launch packaged Windows application
        if: runner.os == 'Windows'
        run: node scripts/check-packaged.mjs "dist/win-unpacked/BRAIN CAT.exe"
      - name: Launch packaged Mac Apple Silicon application
        if: matrix.platform == 'mac-arm64'
        run: node scripts/check-packaged.mjs "dist/mac-arm64/BRAIN CAT.app/Contents/MacOS/BRAIN CAT"
      - name: Launch packaged Mac Intel application
        if: matrix.platform == 'mac-intel'
        run: node scripts/check-packaged.mjs "dist/mac/BRAIN CAT.app/Contents/MacOS/BRAIN CAT"
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: Cat-Brain-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error
